plugins {
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom-remap' version '1.15.+'
    id 'ploceus' version '1.15-SNAPSHOT'
    id("com.modrinth.minotaur") version "2.+"
    id "com.diffplug.spotless" version "6.2.2"
}
ploceus {
	setIntermediaryGeneration(2)
}



version = project.mod_version
group = project.maven_group

loom {
    mixin {
        useLegacyMixinAp = true
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.

    // Used for the fabric toolchain in this project.
    maven {
        name = 'Babric'
        url = 'https://maven.glass-launcher.net/babric'
    }
    // Used for mappings.
    maven {
        name = 'Glass Releases'
        url = 'https://maven.glass-launcher.net/releases'
    }
    // Used for StationAPI and HowManyItems.
    maven {
        name = 'Glass Snapshots'
        url = 'https://maven.glass-launcher.net/snapshots'
    }
    // Used for a StationAPI dependency.
    maven {
        name = 'Froge'
        url 'https://maven.minecraftforge.net/'
    }
    // Used for projects that do not have a maven repository, but do have a GitHub repository with working build scripts.
    maven {
        name = 'Jitpack'
        url = 'https://jitpack.io'
    }
    // Used for another StationAPI dependency
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    mavenCentral()
    maven { url = "https://maven.ornithemc.net/releases" }
    maven { url = "https://mvn.devos.one/releases" }
    maven { url = "https://matthewperiut.github.io/repository" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings(ploceus.mappings("net.glasslauncher:biny-ornithe:b1.7.3+build.${project.biny_mappings}:mergedv2"))

    clientExceptions ploceus.raven(project.client_raven_build, 'client')
    serverExceptions ploceus.raven(project.server_raven_build, 'server')
    clientSignatures ploceus.sparrow(project.client_sparrow_build, 'client')
    serverSignatures ploceus.sparrow(project.server_sparrow_build, 'server')
    "clientNests"("net.glasslauncher:biny-nests:b1.7.3-client+build.2")
    "serverNests"("net.glasslauncher:biny-nests:b1.7.3-server+build.2")
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    def lombok = "org.projectlombok:lombok:1.18.36"
    compileOnly lombok
    annotationProcessor lombok
    include(implementation("com.github.GeyserMC:MCAuthLib:d9d773e5d50327c33898c65cd545a4f6ef3ba1b5"))
    implementation(include("blue.endless:jankson:1.2.1") as Dependency)

    implementation "com.google.guava:guava:33.2.1-jre"
    implementation "com.google.code.gson:gson:2.9.0"
    implementation "org.slf4j:slf4j-api:1.8.0-beta4"
    implementation 'org.apache.logging.log4j:log4j-slf4j18-impl:2.17.2'
    implementation(include("me.carleslc:Simple-Yaml:1.8.4") as Dependency)

    // Optional, but convenient mods for mod creators and users alike.
    // TODO: babric2ornithe - verify this dependency is available for ornithe
    // modImplementation("net.glasslauncher.mods:ModMenu:${project.modmenu_version}") {
    // transitive false
    // }

    // TODO: babric2ornithe - verify this dependency is available for ornithe
    // modImplementation("net.glasslauncher.mods:glass-networking:${project.glass_networking_version}") {
    // transitive false
    // }

    modImplementation("net.glasslauncher.mods:GlassConfigAPI:${project.gcapi_version}") {
    	transitive = false
    }

    modImplementation("com.periut:retrocommands:${project.retrocommands_version}") {
    	transitive = false
    }

//    // StationAPI dependency
//    modImplementation "net.modificationstation:StationAPI:${project.stapi_version}"
//
//    // StationAPI development mods
//    modRuntimeOnly ("maven.modrinth:fast-stapi-intro:${project.stapi_fast_intro_version}") {
//        transitive false
//    }
//
//    modImplementation("com.github.paulevsGitch:BHCreative:${project.bhcreative_version}"){
//        transitive false
//    }
//
//    modImplementation("net.glasslauncher.mods:AlwaysMoreItems:${project.alwaysmoreitems_version}") {
//        transitive false
//    }
//
//    modImplementation("net.danygames2014:spawneggs:${project.spawneggs_version}") {
//        transitive false
//    }

    modImplementation "com.periut:starac:${project.starac_version}"
}
// Exclude Legacy Fabric LWJGL 2 wrapper (starac provides LWJGL 3)
configurations.configureEach {
	exclude group: 'org.lwjgl.lwjgl'
}


processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "cTg2WC1D"
    uploadFile = remapJar
    gameVersions = [project.minecraft_version]
    loaders = ["fabric"]
    changelog = rootProject.file("CHANGELOG.md").text
    syncBodyFrom = rootProject.file("README.md").text
}
tasks.modrinth.dependsOn(tasks.modrinthSyncBody)